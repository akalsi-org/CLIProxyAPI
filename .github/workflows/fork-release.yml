name: fork-maintenance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

jobs:
  sync-test-release:
    if: github.repository == 'akalsi-org/CLIProxyAPI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_REPO: akalsi-org/CLIProxyAPI
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test maintenance automation before synchronization
        run: |
          set -euo pipefail
          mkdir -p .local/fork-diagnostics
          ./repo.sh test-maintenance 2>&1 | tee .local/fork-diagnostics/preflight.log
      - name: Configure maintenance identity
        run: |
          git config user.name cli-proxy-api-maintenance
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Prepare upstream candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_MAINTENANCE_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/fork-maintenance.py prepare 2>&1 | tee .local/fork-diagnostics/prepare.log
      - name: Install verified fork toolchain and modules
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ./repo.sh setup 2>&1 | tee .local/fork-diagnostics/setup.log
      - name: Check fork regressions
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p .local/fork-diagnostics
          ./repo.sh check-pr 2>&1 | tee .local/fork-diagnostics/check-pr.log
      - name: Test the candidate
        id: full_tests
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p .local/fork-diagnostics
          ./repo.sh test -json 2> >(tee .local/fork-diagnostics/candidate.stderr.log >&2) \
            | tee .local/fork-diagnostics/candidate.jsonl
      - name: Compare failed tests with exact upstream
        if: failure() && steps.full_tests.outcome == 'failure'
        run: |
          set -euo pipefail
          ./repo.sh diagnose-upstream .local/fork-diagnostics/candidate.jsonl \
            2>&1 | tee .local/fork-diagnostics/comparison.log
      - name: Compile the server
        if: success() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ./repo.sh build 2>&1 | tee .local/fork-diagnostics/build.log
      - name: Build plugin-capable Linux amd64 artifact
        if: steps.candidate.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          COMMIT: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p .local/fork-release/archive
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e RELEASE_VERSION -e COMMIT -e BUILD_DATE \
            quay.io/pypa/manylinux2014_x86_64@sha256:ffd6d1f11237599748657996b750db6b3a5b724fea5a81cd9ea65add4f45b6c9 \
            bash -euo pipefail -c '
              export PATH="/src/.local/toolchains/go/bin:$PATH"
              export GOTOOLCHAIN=local GOPROXY=off GOMAXPROCS=4
              export GOPATH=/src/.local/cache/gopath GOMODCACHE=/src/.local/cache/modules GOCACHE=/src/.local/cache/go-build
              CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -mod=readonly -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o .local/fork-release/archive/cli-proxy-api ./cmd/server/
              glibc_versions="$(readelf --version-info .local/fork-release/archive/cli-proxy-api | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "$glibc_versions" ]] && [[ "$(printf "2.17\n%s\n" "$glibc_versions" | sort -V | tail -n 1)" != 2.17 ]]; then
                printf "Artifact requires GLIBC newer than 2.17.\n" >&2
                exit 1
              fi
            '
          cp LICENSE README.md README_CN.md config.example.yaml .local/fork-release/archive/
          tar -C .local/fork-release/archive -czf ".local/fork-release/CLIProxyAPI_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - name: Publish tested source and completed release
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_MAINTENANCE_TOKEN || github.token }}
        run: python3 .github/scripts/fork-maintenance.py publish
      - name: Preserve maintenance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-maintenance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/fork-diagnostics/
            .local/fork-candidate.json
          include-hidden-files: true
          if-no-files-found: ignore
